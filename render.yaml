services:
  - type: web
    name: apk-guardian-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.cli init-db && python -m uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: backend
      - key: SECRET_KEY
        value: WEThq0LDcxeXR4mzcx_wxTMDYgYtAEpM_gesjJ3aLtAIM8gozjiZzy49olHV2vHu
      - key: ALLOW_SYNTHETIC_MODEL
        value: "false"
      - key: ENABLE_AI_EXPLANATIONS
        value: "true"
      - key: MAX_APK_SIZE_MB
        value: "100"
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "120"
